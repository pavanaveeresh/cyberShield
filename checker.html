<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Checker - CyberShield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Fraud Message Checker</h1>
        <p>Check messages for common warning signs</p>
    </header>

    <main>
        <h2>Check a Suspicious Message</h2>

        <textarea id="message"
            placeholder="Paste a suspicious message here..."
            rows="6"
            style="width: 80%; padding: 15px;">
        </textarea>

        <br><br>

        <button onclick="checkMessage()">Check Message</button>

        <div id="result" class="card" style="margin-top: 25px;">
            Results will appear here.
        </div>

        <p><a href="index.html">Back to Home</a></p>
    </main>

    <script src="checker.js"></script>

</body>
</html>
