<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Dashboard - CyberShield</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Learning Dashboard</h1>
    <p>Track Your Cyber Safety Learning</p>
</header>

<main>
    <h2>Your Learning Progress</h2>

    <section class="features">

        <div class="card">
            <h3>Total Quiz Questions</h3>
            <p id="total">5</p>
        </div>

        <div class="card">
            <h3>Correct Answers</h3>
            <p id="correct">0</p>
        </div>

        <div class="card">
            <h3>Your Score</h3>
            <p id="percentage">0%</p>
        </div>

    </section>

    <p><a href="index.html">Back to Home</a></p>
</main>

<footer>
    <p>CyberShield | Stay Alert. Stay Safe.</p>
</footer>

<script src="dashboard.js"></script>

</body>
</html>
